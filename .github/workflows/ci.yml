name: CI

on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradlw/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build