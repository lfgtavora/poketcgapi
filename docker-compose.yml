services:
  api:
    depends_on:
      db:
        condition: service_healthy
    build: .
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      POKETCG_SYNC_ENABLED: "true"
      POKETCG_SYNC_FAIL_ON_ERROR: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/poketcg
      SPRING_DATASOURCE_USERNAME: poketcg
      SPRING_DATASOURCE_PASSWORD: poketcg
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: poketcg
      POSTGRES_USER: poketcg
      POSTGRES_PASSWORD: poketcg
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poketcg -d poketcg"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data: